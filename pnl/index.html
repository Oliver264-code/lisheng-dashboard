* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f6f9; color:#1f2d3d; font-size:14px; }
.wrap { max-width:1080px; margin:0 auto; padding:12px; }
h1 { font-size:18px; padding:6px 2px 10px; }
.sub { color:#8492a6; font-size:12px; margin:-8px 2px 10px; }
.controls { background:#fff; border-radius:10px; padding:10px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.seg { display:flex; background:#eef1f6; border-radius:8px; overflow:hidden; }
.seg b { font-weight:normal; font-size:12px; }
.seg span { padding:6px 12px; cursor:pointer; font-size:12px; color:#5a6b87; white-space:nowrap; }

.ctl-label { font-size:12px; color:#8492a6; margin-left:4px; }
input[type=date] { border:1px solid #dcdfe6; border-radius:6px; padding:4px 6px; font-size:12px; color:#1f2d3d; background:#fff; }
.kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
.kpi { background:#fff; border-radius:10px; padding:10px 12px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.kpi .t { font-size:11px; color:#8492a6; }
.kpi .v { font-size:17px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.kpi .s { font-size:10px; color:#a0aec0; margin-top:2px; }
.pos { color:#16a34a; } .neg { color:#dc2626; }
.card { background:#fff; border-radius:10px; padding:12px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.card h2 { font-size:14px; margin-bottom:8px; }
#chart { width:100%; height:300px; }
.tblwrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:12px; white-space:nowrap; }
th, td { padding:6px 8px; text-align:right; border-bottom:1px solid #f0f2f5; font-variant-numeric:tabular-nums; }
th { color:#8492a6; font-weight:500; background:#fafbfc; position:sticky; top:0; }
td:first-child, th:first-child { text-align:left; position:sticky; left:0; background:inherit; }
tr.total td { font-weight:600; border-top:2px solid #e5e9f0; background:#fafbfc; }
tr.dim td { color:#8492a6; }
.notes { background:#fff; border-radius:10px; padding:12px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.notes h2 { font-size:14px; margin-bottom:8px; }
.notes li { font-size:12px; color:#5a6b87; line-height:1.7; margin-left:16px; }
.tag { display:inline-block; font-size:10px; padding:1px 6px; border-radius:4px; margin-left:4px; vertical-align:1px; }
.tag.warn { background:#fef3c7; color:#b45309; }
.tag.info { background:#dbeafe; color:#1d4ed8; }
@media (min-width:720px) { .kpis { grid-template-columns:repeat(5,1fr); } #chart { height:340px; } }
</style>
</head>

var M = DATA.meta;
var LN = M.line_name, CN = M.city_name;
var $ = function(id){ return document.getElementById(id); };

function fmt(n, dec){ if(n===null||n===undefined||isNaN(n)) return '—';
  var s = Number(n).toLocaleString('zh-CN', {minimumFractionDigits:dec===undefined?1:dec, maximumFractionDigits:dec===undefined?1:dec});
  return s; }
function money(n){ return (n<0?'-':'') + '¥' + fmt(Math.abs(n), n%1?1:0); }
function cls(n){ return n>0.005?'pos':(n<-0.005?'neg':''); }

// ---------- 状态 ----------
var S = { line:'all', city:'all', gran:'day', d1:M.start, d2:M.data_end };

// ---------- 控件 ----------
function seg(id, items, key){
  var el = $(id); el.innerHTML='';
  items.forEach(function(it){
    var s = document.createElement('span');
    s.textContent = it.label;
    if (S[key]===it.v) s.className='on';
    s.onclick = function(){ S[key]=it.v; render(); };
    el.appendChild(s);
  });
}
function drawSegs(){
  seg('segLine', [{v:'all',label:'全部条线'},{v:'xhs',label:LN.xhs},{v:'bili',label:LN.bili}], 'line');
  seg('segCity', [{v:'all',label:'全部地区'},{v:'gz',label:CN.gz},{v:'cd',label:CN.cd},{v:'nat',label:CN.nat}], 'city');
  seg('segGran', [{v:'day',label:'日'},{v:'week',label:'周'},{v:'month',label:'月'},{v:'year',label:'年'}], 'gran');
  $('d1').value = S.d1; $('d2').value = S.d2;
}
$('d1').onchange = function(){ S.d1 = this.value || M.start; render(); };
$('d2').onchange = function(){ S.d2 = this.value || M.data_end; render(); };

// ---------- 过滤 ----------
function inRange(d){ return d >= S.d1 && d <= S.d2; }
function matchSp(r){ return inRange(r.d) && (S.line==='all'||r.l===S.line) && (S.city==='all'||r.c===S.city); }
function matchOr(r){
  if (!inRange(r.d)) return false;
  if (r.l==='na') return S.line==='all' && S.city==='all';
  return (S.line==='all'||r.l===S.line) && (S.city==='all'||r.c===S.city);
}

// ---------- 聚合 ----------
function bucket(d){
  if (S.gran==='day') return d;
  if (S.gran==='month') return d.slice(0,7);
  if (S.gran==='year') return d.slice(0,4);
  var dt = new Date(d); var day = (dt.getDay()+6)%7;   // 周一=0
  dt.setDate(dt.getDate()-day);
  var mon = dt.toISOString().slice(5,10);
  var e = new Date(dt); e.setDate(e.getDate()+6);
  return mon + '~' + e.toISOString().slice(5,10);
}
function agg(){
  var B = {};
  function box(k){ if(!B[k]) B[k]={book:0,real:0,brush:0,n:0,succ:0,disc:0,comm:0,exp:0}; return B[k]; }
  DATA.spend_daily.forEach(function(r){ if(!matchSp(r)) return; var b=bucket(r.d), x=box(b);
    x.book+=r.book; x.real+=r.real; x.brush+=r.brush; });
  DATA.orders_daily.forEach(function(r){ if(!matchOr(r)) return; var b=bucket(r.d), x=box(b);
    x.n+=r.n; x.succ+=r.succ; x.disc+=r.disc; x.comm+=r.comm; x.exp+=r.exp; });
  var keys = Object.keys(B).sort();
  return { keys:keys, B:B };
}

// ---------- KPI ----------
function kpiCard(t, v, s, c){
  return '<div class="kpi"><div class="t">'+t+'</div><div class="v '+(c||'')+'">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';
}
function renderKpis(T){
  var k = $('kpis');
  var cost = T.n>0 ? T.real/T.n : null;
  var avgc = T.succ>0 ? T.comm/T.succ : null;
  var pnl = T.comm - T.real - T.brush;
  var pnlE = T.exp - T.real - T.brush;
  k.innerHTML =
    kpiCard('账面消耗', money(T.book), '返点抵扣 '+money(T.book-T.real)) +
    kpiCard('实际消耗', money(T.real), '小红书÷1.15 B站÷1.31') +
    kpiCard('刷量消耗', money(T.brush), '芒狗退款净额') +
    kpiCard('订单数', fmt(T.n,0), '成功 '+fmt(T.succ,0)+' 单 废弃 '+fmt(T.disc,0)+' 单') +
    kpiCard('平均订单成本', cost===null?'—':money(cost), '实际消耗÷订单') +
    kpiCard('成功单均佣', avgc===null?'—':money(avgc), '佣金÷成功单数') +
    kpiCard('佣金收入', money(T.comm), '成功单×目录佣金') +
    kpiCard('实际盈亏', money(pnl), '佣金−实际消耗−刷量', cls(pnl)) +
    kpiCard('预期盈亏', money(pnlE), '在途单×龄出佣率×状态', cls(pnlE));
}

// ---------- 图表 ----------
var chart = null;
function renderChart(T){
  var B = agg();
  var xs = B.keys, book=[], comm=[], pnl=[], pnlE=[];
  xs.forEach(function(k){ var x=B.B[k]; book.push(Math.round(x.book)); comm.push(Math.round(x.comm)); pnl.push(Math.round((x.comm-x.real-x.brush)*100)/100); pnlE.push(Math.round((x.exp-x.real-x.brush)*100)/100); });
  chart = chart || echarts.init($('chart'));
  chart.setOption({
    tooltip:{trigger:'axis'},
    legend:{data:['账面消耗','佣金收入','实际盈亏','预期盈亏'], textStyle:{fontSize:11}},
    grid:{left:8,right:8,top:30,bottom:20,containLabel:true},
    xAxis:{type:'category',data:xs,axisLabel:{fontSize:10}},
    yAxis:[{type:'value',axisLabel:{fontSize:10},splitLine:{lineStyle:{color:'#f0f2f5'}}}],
    series:[
      {name:'账面消耗',type:'bar',data:book,itemStyle:{color:'#93b4f8'},barMaxWidth:14},
      {name:'佣金收入',type:'line',data:comm,lineStyle:{width:2,color:'#8b5cf6'},itemStyle:{color:'#8b5cf6'}},
      {name:'实际盈亏',type:'line',data:pnl,lineStyle:{width:2,color:'#16a34a'},itemStyle:{color:'#16a34a'}},
      {name:'预期盈亏',type:'line',data:pnlE,lineStyle:{width:2,type:'dashed',color:'#f59e0b'},itemStyle:{color:'#f59e0b'}}
    ]
  }, true);
}

function renderTable(){

      + '<td>'+fmt(x.comm)+'</td><td class="'+cls(pnl)+'">'+fmt(pnl)+'</td><td class="'+cls(pnlE)+'">'+fmt(pnlE)+'</td></tr>';
  });
  $('tbl').innerHTML = h + '</tbody>';
}

// ---------- 条线×城市矩阵 ----------
function cell(l, c){
  var x = {book:0,real:0,brush:0,n:0,succ:0,disc:0,comm:0,exp:0};
  DATA.spend_daily.forEach(function(r){ if(inRange(r.d)&&r.l===l&&r.c===c){ x.book+=r.book; x.real+=r.real; x.brush+=r.brush; } });
  DATA.orders_daily.forEach(function(r){ if(inRange(r.d)&&r.l===l&&r.c===c){ x.n+=r.n; x.succ+=r.succ; x.disc+=r.disc; x.comm+=r.comm; x.exp+=r.exp; } });
  return x;
}
function rowHtml(label, x, dim){
  var pnl = x.comm-x.real-x.brush, pnlE = x.exp-x.real-x.brush;
  return '<tr'+(dim?' class="dim"':'')+'><td>'+label+'</td><td>'+fmt(x.book)+'</td><td>'+fmt(x.real)+'</td><td>'+fmt(x.brush)+'</td>'
    + '<td>'+fmt(x.n,0)+'</td><td>'+fmt(x.succ,0)+'</td><td>'+fmt(x.n-x.succ,0)+'</td><td>'+fmt(x.disc,0)+'</td>'
    + '<td>'+(x.n?fmt(x.real/x.n):'—')+'</td><td>'+(x.succ?fmt(x.comm/x.succ):'—')+'</td>'
    + '<td>'+fmt(x.comm)+'</td><td class="'+cls(pnl)+'">'+fmt(pnl)+'</td><td class="'+cls(pnlE)+'">'+fmt(pnlE)+'</td></tr>';
}

  combos.forEach(function(p){ h += rowHtml(LN[p[0]]+' · '+CN[p[1]], cell(p[0],p[1])); });
  var na = {book:0,real:0,brush:0,n:0,succ:0,disc:0,comm:0,exp:0};

    '<li><b>返点：</b>小红书 15%、B站 31%，实际消耗 = 账面 ÷ 1.15 / ÷ 1.31。</li>' +
    '<li><b>佣金：</b>广州移动按 ¥260/单；其余按极速通目录实际佣金（含广州电信 ¥462/单，目录已配置）。</li>' +
    '<li><b>订单归属：</b>跟投放端走——广州计划出的单记广州、全国计划出的单记全国；<b>小程序单与无法归因的单只进项目总</b>，因此条线之和小于项目总。</li>' +
    '<li><b>时间：</b>数据自 2026-10-01 起，更新至前一日；周=自然周（周一起）。最近1-2日B站消耗按趋势口径暂记，结算后自动校正。在途=未成功在途（含待上门/已触达等），废弃=废弃单（不计盈亏）。</li>' +
    '<li><b>成功单口径：</b>已下单 / 已归档都算成功单（丽胜按下单计佣，广州移动 ¥260/单在已下单即确认）。<b>预期盈亏：</b>未成功在途单按「下单龄成功率曲线（随每日重建重估）× 工单推进度（待上门/后台跟进=70%，已触达=40%，延期=60%，无动作=10%）」估算；废弃单不参与盈亏，只计数展示。</li>' +
    '<li><b>刷量消耗：</b>口径已预留，数据录入前按 0 计。</li>' +
    gapNote + nc;
}

// ---------- 渲染 ----------
function render(){
  drawSegs();
  var T = {book:0,real:0,brush:0,n:0,succ:0,disc:0,comm:0,exp:0};
  var B = agg();
  B.keys.forEach(function(k){ var x=B.B[k]; for(var f in T) T[f]+=x[f]; });
  renderKpis(T);
  renderChart(T);
  renderTable();
  renderMatrix();
  $('subline').textContent = '数据区间 ' + M.start + ' ~ ' + M.data_end + ' · 构建时点 ' + M.built_at + ' · 当前筛选：' +
    (S.line==='all'?'全部条线':LN[S.line]) + ' / ' + (S.city==='all'?'全部地区':CN[S.city]);
}
window.addEventListener('resize', function(){ if(chart) chart.resize(); });
render();
</script>
