function makerOf(nid){ var n = DATA.notes[nid]; return (n && n.maker) ? n.maker : '未登记'; }
function titleOf(nid){ var n = DATA.notes[nid]; return (n && n.title) ? n.title : (nid ? nid.slice(0,12)+'…' : ''); }

function inRange(d){ return d >= S.d1 && d <= S.d2; }
function matchOrder(o){
  if (!inRange(o.d)) return false;
  if (o.l === 'na') return !S.line && !S.city && !S.maker && !S.note;
  if (S.line && o.l !== S.line) return false;
  if (S.city && o.c !== S.city) return false;
  if (S.maker && makerOf(o.nid) !== S.maker) return false;
  if (S.note && o.nid !== S.note) return false;

}
function matchSpendLine(r){
  if (!inRange(r.d)) return false;
  if (r.l === 'na') return !S.line && !S.city && !S.maker && !S.note;
  if (S.line && r.l !== S.line) return false;

function matchCreative(r){

  if (S.line && S.line !== 'xhs') return false;
  if (S.city && r.k !== S.city) return false;
  if (S.maker && makerOf(r.n) !== S.maker) return false;
  if (S.note && r.n !== S.note) return false;

}

function metrics(orders, discN, book, real, brush, mc){
  var comm = 0, exp = 0, succ = 0;
  orders.forEach(function(o){ comm += o.comm; exp += o.exp; succ += o.succ; });
  return {book:book, real:real, brush:brush, mc:mc, n:orders.length, succ:succ,
          pend:orders.length - succ, disc:discN, comm:comm, exp:exp,
          mcCost: mc ? book/mc : null, delivCost: succ ? book/succ : null,
          delivRate: orders.length ? succ/orders.length : null,

}
function scopeMetrics(){
  var os = DATA.orders.filter(matchOrder);
  var disc = DATA.disc.filter(function(o){ return matchOrder({d:o.d, l:o.l, c:o.c, nid:''}); }).length;
  var book=0, real=0, brush=0;
  DATA.spend_daily.forEach(function(r){ if (matchSpendLine(r)) { book+=r.book; real+=r.real; brush+=r.brush; } });
  var mc = 0;
  DATA.creative_daily.forEach(function(r){ if (matchCreative(r)) mc += r.m; });

  DATA.creative_daily.forEach(function(r){ if (matchCreative(r) && S.note) { book += r.f; real += r.f/1.15; } });

    if (!inRange(o.d)) return;
    var k = dim==='line' ? o.l : (dim==='city' ? o.c : (o.l==='na' ? 'na' : null));
    if (o.l === 'na' && (S.line || S.city || S.maker || S.note)) return;
    if (S.line && o.l !== S.line) return;
    if (S.city && o.c !== S.city) return;
    if (!k) return;
    (g[k] = g[k] || 0), g[k] = (g[k]||0) + 1;
  });
  return g;
}
function groupSpend(dim){
  var g = {};
  DATA.spend_daily.forEach(function(r){
    if (!matchSpendLine(r)) return;
    var k = dim==='line' ? r.l : (dim==='city' ? r.c : null);
    if (!k) return;
    (g[k] = g[k] || {book:0, real:0, brush:0});
    g[k].book += r.book; g[k].real += r.real; g[k].brush += r.brush;
  });
  if (dim==='maker' || dim==='note' || dim==='creative') {
    DATA.creative_daily.forEach(function(r){
      if (!matchCreative(r)) return;
      var k = dim==='maker' ? makerOf(r.n) : (dim==='note' ? r.n : r.cid);
      (g[k] = g[k] || {book:0, real:0, brush:0});
      g[k].book += r.f;
    });
  }
  return g;
}

function groupMC(dim){
  var g = {};
  DATA.creative_daily.forEach(function(r){
    if (!inRange(r.d)) return;
    if (S.line === 'bili') return;
    if (S.city && r.k !== S.city) return;
    if (S.maker && makerOf(r.n) !== S.maker) return;
    if (S.note && r.n !== S.note) return;
    var k = dim==='line' ? 'xhs' : (dim==='city' ? r.k : (dim==='maker' ? makerOf(r.n) : (dim==='note' ? r.n : r.cid)));
    g[k] = (g[k]||0) + r.m;
  });
  return g;
}

// KPI
function kpiCard(t, v, s, c){ return '<div class="kpi"><div class="t">'+t+'</div><div class="v '+(c||'')+'">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'; }
function renderKpis(T){
  var cost = T.n ? T.real/T.n : null;
  var avgc = T.succ ? T.comm/T.succ : null;
  $('kpis').innerHTML =
    kpiCard('账面消耗', money(T.book), '返点抵扣 '+money(T.book-T.real)) +
    kpiCard('实际消耗', money(T.real), '小红书÷1.15 B站÷1.31') +
    kpiCard('刷量消耗', money(T.brush), '芒狗退款净额') +
    kpiCard('进线数', fmt(T.mc,0), '聚光私信+B站表单') +
    kpiCard('订单数', fmt(T.n,0), '成功 '+fmt(T.succ,0)+' 在途 '+fmt(T.pend,0)+' 废弃 '+fmt(T.disc,0)) +
    kpiCard('平均订单成本', cost===null?'—':money(cost), '实际消耗÷订单') +
    kpiCard('成功单均佣', avgc===null?'—':money(avgc), '佣金÷成功单') +
    kpiCard('佣金收入', money(T.comm), '成功单×目录佣金') +
    kpiCard('实际盈亏', money(T.pnl), '佣金−实际消耗−刷量', cls(T.pnl)) +
    kpiCard('预期盈亏', money(T.pnlE), '在途×成功率×状态', cls(T.pnlE));
}

// 图表
var chart = null;
function bucket(d){
  if (S.gran==='day') return d;
  if (S.gran==='month') return d.slice(0,7);
  if (S.gran==='week') {
    var dt = new Date(d); var day = (dt.getDay()+6)%7;
    dt.setDate(dt.getDate()-day);
    var e = new Date(dt); e.setDate(e.getDate()+6);
    return dt.toISOString().slice(5,10) + '~' + e.toISOString().slice(5,10);
  }
  return d.slice(0,4);
}
function renderChart(){
  var B = {};
  DATA.spend_daily.forEach(function(r){ if(!matchSpendLine(r)) return; var b = bucket(r.d); (B[b]=B[b]||{book:0,real:0,brush:0}); B[b].book+=r.book; B[b].real+=r.real; B[b].brush+=r.brush; });
  DATA.orders.filter(matchOrder).forEach(function(o){ var b = bucket(o.d); (B[b]=B[b]||{book:0,real:0,brush:0}); B[b]._c=(B[b]._c||0)+o.comm; B[b]._e=(B[b]._e||0)+o.exp; });
  var xs = Object.keys(B).sort();
  var book=[], comm=[], pnl=[], pnlE=[];
  xs.forEach(function(k){ var x=B[k];
    book.push(Math.round(x.book)); comm.push(Math.round(x._c||0));
    pnl.push(Math.round(((x._c||0)-x.real-x.brush)*100)/100);
    pnlE.push(Math.round(((x._e||0)-x.real-x.brush)*100)/100);
  });
  chart = chart || echarts.init($('chart'));
  chart.setOption({
    tooltip:{trigger:'axis'},
    legend:{data:['账面消耗','佣金收入','实际盈亏','预期盈亏'], textStyle:{fontSize:11}},
    grid:{left:8,right:8,top:30,bottom:20,containLabel:true},
    xAxis:{type:'category',data:xs,axisLabel:{fontSize:10}},
    yAxis:[{type:'value',axisLabel:{fontSize:10},splitLine:{lineStyle:{color:'#f0f2f5'}}}],
    series:[
      {name:'账面消耗',type:'bar',data:book,itemStyle:{color:'#93b4f8'},barMaxWidth:14},
      {name:'佣金收入',type:'line',data:comm,lineStyle:{width:2,color:'#8b5cf6'},itemStyle:{color:'#8b5cf6'}},
      {name:'实际盈亏',type:'line',data:pnl,lineStyle:{width:2,color:'#16a34a'},itemStyle:{color:'#16a34a'}},
      {name:'预期盈亏',type:'line',data:pnlE,lineStyle:{width:2,type:'dashed',color:'#f59e0b'},itemStyle:{color:'#f59e0b'}}
    ]
  }, true);
}

// 下钻表
function nodeRow(dim, key, T, total){
  var label;
  if (dim==='line') label = LN[key] || key;
  else if (dim==='city') label = CN[key] || key;
  else if (dim==='maker') label = key;
  else if (dim==='note') label = titleOf(key) || key;
  else label = key;
  var cost = T.n ? T.real/T.n : null;
  var avgc = T.succ ? T.comm/T.succ : null;
  return '<tr class="node" data-dim="'+dim+'" data-key="'+key+'"><td>'+label+'</td>'
    + '<td>'+fmt(T.book)+'</td><td>'+fmt(T.real)+'</td><td>'+fmt(T.brush)+'</td><td>'+fmt(T.mc,0)+'</td>'
    + '<td>'+(T.mcCost===null?'—':fmt(T.mcCost))+'</td>'
    + '<td>'+fmt(T.n,0)+'</td><td>'+fmt(T.succ,0)+'</td><td>'+fmt(T.pend,0)+'</td><td>'+fmt(T.disc,0)+'</td>'
    + '<td>'+(cost===null?'—':fmt(cost))+'</td><td>'+(avgc===null?'—':fmt(avgc))+'</td>'
    + '<td>'+(T.delivCost===null?'—':fmt(T.delivCost))+'</td><td>'+(T.delivRate===null?'—':fmt(T.delivRate*100,0))+'</td>'
    + '<td>'+fmt(T.comm)+'</td><td class="'+cls(T.pnl)+'">'+fmt(T.pnl)+'</td><td class="'+cls(T.pnlE)+'">'+fmt(T.pnlE)+'</td></tr>';
}
var DRILL_HEAD = '<thead><tr><th id="drillLabel">维度</th><th>账面消耗</th><th>实际消耗</th><th>刷量</th><th>进线</th><th>进线成本</th><th>订单</th><th>成功</th><th>在途</th><th>废弃</th><th>单均成本</th><th>成功均佣</th><th>交付成本</th><th>交付率%</th><th>佣金</th><th>实际盈亏</th><th>预期盈亏</th></tr></thead>';
function renderDrill(){
  var dim = nextDim();
  var card = $('drillTitle');
  if (!dim) {
    // 已到创意层：列出该笔记的创意
    card.textContent = '创意级投放（' + titleOf(S.note) + '，区间累计）';
    var g = {};
    DATA.creative_daily.forEach(function(r){ if (matchCreative(r)) { (g[r.cid] = g[r.cid] || {f:0, m:0, cn:r.cn}); g[r.cid].f += r.f; g[r.cid].m += r.m; } });
    var h = '<thead><tr><th>创意</th><th>消耗</th><th>进线</th></tr></thead><tbody>';
    Object.keys(g).sort(function(a,b){ return g[b].f - g[a].f; }).forEach(function(k){
      h += '<tr><td>' + (g[k].cn || k) + '</td><td>' + fmt(g[k].f) + '</td><td>' + fmt(g[k].m,0) + '</td></tr>';
    });
    $('drill').innerHTML = h + '</tbody>';
    return;
  }
  card.textContent = '按「' + DIM_LABEL[dim] + '」分组（点击行下钻）';
  var go = groupOrders(dim), gd = groupDisc(dim), gs = groupSpend(dim), gm = groupMC(dim);
  var keys = {};
  Object.keys(go).forEach(function(k){ keys[k]=1; });
  Object.keys(gs).forEach(function(k){ keys[k]=1; });
  var h = DRILL_HEAD + '<tbody>';
  Object.keys(keys).sort(function(a,b){
    var fa = (go[a]||[]).length + (gs[a]?gs[a].book/1000:0), fb = (go[b]||[]).length + (gs[b]?gs[b].book/1000:0);
    return fb - fa;
  }).forEach(function(k){
    var T = metrics(go[k]||[], gd[k]||0, (gs[k]||{}).book||0, (gs[k]||{}).real||0, (gs[k]||{}).brush||0, gm[k]||0);
    h += nodeRow(dim, k, T);
  });
  $('drill').innerHTML = h + '</tbody>';
  Array.prototype.forEach.call($('drill').querySelectorAll('tr.node'), function(tr){
    tr.onclick = function(){
      var dim = tr.getAttribute('data-dim'), key = tr.getAttribute('data-key');
      if (dim==='line') S.line = key;
      else if (dim==='city') S.city = key;
      else if (dim==='maker') S.maker = key;
      else if (dim==='note') S.note = key;
      render();
    };
  });
}

// 分时段明细
function renderTable(){
  var B = {};
  DATA.spend_daily.forEach(function(r){ if(!matchSpendLine(r)) return; var b = bucket(r.d); (B[b]=B[b]||{book:0,real:0,brush:0}); B[b].book+=r.book; B[b].real+=r.real; B[b].brush+=r.brush; });
  DATA.orders.filter(matchOrder).forEach(function(o){ var b = bucket(o.d); (B[b]=B[b]||{book:0,real:0,brush:0}); B[b]._n=(B[b]._n||0)+1; B[b]._s=(B[b]._s||0)+o.succ; B[b]._c=(B[b]._c||0)+o.comm; B[b]._e=(B[b]._e||0)+o.exp; });
  var h = '<thead><tr><th>时段</th><th>账面消耗</th><th>实际消耗</th><th>刷量</th><th>订单</th><th>成功</th><th>单均成本</th><th>成功均佣</th><th>佣金</th><th>实际盈亏</th><th>预期盈亏</th></tr></thead><tbody>';

  });
  $('tbl').innerHTML = h + '</tbody>';
}

// 创意卡（笔记层显示）
function renderCreative(){
  $('creativeCard').style.display = S.note ? '' : 'none';

// 面包屑
function renderCrumb(){
  var items = [['', '项目']];
  if (S.line) items.push(['line', LN[S.line]||S.line]);
  if (S.city) items.push(['city', CN[S.city]||S.city]);
  if (S.maker) items.push(['maker', S.maker]);
  if (S.note) items.push(['note', titleOf(S.note) || S.note]);
  var h = '';
  items.forEach(function(it, i){
    var isLast = i === items.length-1;
    if (it[0]==='') h += '<b class="cur">项目</b>';
    else h += (isLast ? '<b class="cur">' : '<b data-pop="'+it[0]+'">') + it[1] + '</b>';
    if (!isLast) h += '<span class="sep">›</span>';
  });
  h += '<span style="margin-left:auto;font-size:11px;color:#8492a6">点击已选层级可返回</span>';

  Array.prototype.forEach.call($('crumb').querySelectorAll('b[data-pop]'), function(b){
    b.onclick = function(){ var k = b.getAttribute('data-pop'); if (k==='note') S.note=''; else if (k==='maker') { S.maker=''; S.note=''; } else if (k==='city') { S.city=''; S.maker=''; S.note=''; } else { S.line=''; S.city=''; S.maker=''; S.note=''; } render(); };
  });
}

// 控件
function drawSegs(){
  function fill(id, items, key){
    var el = $(id); el.innerHTML = '';
    var all = [{v:'', label:'全部'}].concat(items);
    all.forEach(function(it){
      var s = document.createElement('span');
      s.textContent = it.label;
      if (S[key] === it.v) s.className = 'on';
      s.onclick = function(){
        if (key==='line') { S.line = it.v; S.city=''; S.note=''; }
        else if (key==='city') { S.city = it.v; }
        else { S.gran = it.v; }
        render();
      };
      el.appendChild(s);
    });
  }
  fill('segLine', [{v:'xhs',label:LN.xhs},{v:'bili',label:LN.bili}], 'line');
  var cities = [{v:'gz',label:CN.gz},{v:'cd',label:CN.cd},{v:'nat',label:CN.nat}];
  if (S.line === 'bili') cities = [{v:'gz',label:CN.gz},{v:'nat',label:CN.nat}];
  fill('segCity', cities, 'city');
  fill('segGran', [{v:'day',label:'日'},{v:'week',label:'周'},{v:'month',label:'月'}], 'gran');
  var sel = $('selMaker');
  var cur = S.maker;
  var mk = Object.keys(DATA.notes ? {} : {}).length;
  var makers = DATA.makers.slice().sort();
  sel.innerHTML = '<option value="">全部</option>' + makers.map(function(m){ return '<option'+(S.maker===m?' selected':'')+'>'+m+'</option>'; }).join('');
}
$('selMaker').onchange = function(){ S.maker = this.value || ''; if (!S.maker) S.note=''; render(); };
$('d1').onchange = function(){ S.d1 = this.value || M.start; render(); };
$('d2').onchange = function(){ S.d2 = this.value || M.data_end; render(); };

function renderNotes(){
  var gap = M.bili422_max ? '<li><b>数据缺口：</b>B站爱豆菌户（4221900，广州+全国混投）自 '+M.bili422_max+' 次日起缺数（账号接口故障，待恢复后补齐），对应消耗未计入。</li>' : '';
  $('noteList').innerHTML =
    '<li><b>自营模拟口径：</b>佣金全算收入、消耗全算成本。丽胜10月已付代运营¥50,000+投放¥50,000 另计。返点：小红书÷1.15、B站÷1.31。</li>' +
    '<li><b>成功单：</b>已下单/已归档（丽胜按下单计佣）。佣金=成功单×极速通目录佣金（广州移动¥260）。废弃单只计数不进盈亏。</li>' +
    '<li><b>维度链路：</b>项目 › 条线 › 城市 › 个人(制作人) › 笔记 › 创意，逐层点击下钻；个人维度来自总笔记库「制作人」。B站无创意/个人级数据源，停留在条线/城市。</li>' +
    '<li><b>预期盈亏：</b>未成功在途单按「下单龄成功率曲线 × 工单推进度」估算，随每日重建收敛。</li>' +
    '<li><b>时间：</b>数据自 2026-09-01 起，更新至前一日；周=自然周（周一起）。最近1-2日B站消耗按趋势口径暂记。</li>' +
    '<li><b>刷量消耗：</b>芒狗退款净额（B站条线），不享受平台返点。刷量无法定位城市的部分并入项目总。</li>' +
    gap;

function renderRT(){
  var atProject = !S.line && !S.city && !S.maker && !S.note;

function renderAttr(){

  h += '<tr><td>'+fmt(DATA.orders.length + DATA.disc.length,0)+'</td><td>'+fmt(DATA.orders.length,0)+'</td><td>'+fmt(DATA.disc.length,0)+'</td><td>'+fmt(attr,0)+'</td><td>'+fmt(naN,0)+'</td><td>'+fmt(attr/DATA.orders.length*100,0)+'%</td><td>'+fmt(succ,0)+'</td><td>'+fmt(succ/DATA.orders.length*100,0)+'%</td></tr>';
  h += '</tbody>';

}

function render(){
  // 同步个人下拉
  var sel = $('selMaker');
  sel.innerHTML = '<option value="">全部</option>' + DATA.makers.slice().sort().map(function(m){ return '<option'+(S.maker===m?' selected':'')+'>'+m+'</option>'; }).join('');
